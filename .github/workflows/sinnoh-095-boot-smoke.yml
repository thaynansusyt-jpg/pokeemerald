name: Sinnoh 0.9.5 - Direct GBA core input test
on:
  push:
    branches: [sinnoh-0.9.5-derrota-inicial]
    paths: ['.github/workflows/sinnoh-095-boot-smoke.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  direct-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install mGBA development library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmgba-dev build-essential
      - name: Download compiled Sinnoh 0.9.5 ROM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rom captures
          gh run download 37870747271 -R "${{ github.repository }}" -n Pokemon-Hoenn-Expansion-Sinnoh-0.9.5-beta -D rom
          test -s rom/pokemon_hoenn_expansion_gen7.gba
      - name: Compile headless mGBA frame-and-input runner
        run: |
          cat > /tmp/gba_test.c <<'C'
          #include <mgba/core/core.h>
          #include <mgba/core/interface.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdbool.h>
          #include <string.h>
          #define W 240
          #define H 160
          #define KEY_A 1
          #define KEY_START 8
          #define KEY_DOWN 128
          #define KEY_RIGHT 16
          static uint32_t framebuf[W * H];
          static void snap(int frame) {
            char path[128];
            snprintf(path, sizeof(path), "captures/frame-%05d.ppm", frame);
            FILE *f=fopen(path,"wb");
            if(!f) return;
            fprintf(f,"P6\n%d %d\n255\n",W,H);
            for(int p=0;p<W*H;p++) {
              uint32_t v=framebuf[p];
              unsigned char rgb[3]={(v>>16)&255,(v>>8)&255,v&255};
              fwrite(rgb,1,3,f);
            }
            fclose(f);
            printf("Saved screenshot %s\n",path);
            fflush(stdout);
          }
          int main(int argc,char **argv) {
            if(argc<2) return 2;
            struct mCore *core=mCoreFind(argv[1]);
            if(!core){fprintf(stderr,"mCoreFind failed\n");return 3;}
            if(!core->init(core)){fprintf(stderr,"core init failed\n");return 4;}
            mCoreInitConfig(core,NULL);
            core->setVideoBuffer(core,framebuf,W);
            if(!mCoreLoadFile(core,argv[1])){fprintf(stderr,"load ROM failed\n");return 5;}
            core->reset(core);
            int marks[]={120,1500,3000,3500,3600,3850,3900,4200,4250,4500,4550,4800,5100,5400,5550,5700,6100,6800,7600,8500,10000,11600,12100,12700,13300,13900,14600,15100,16500};
            size_t mi=0;
            for(int frame=0; frame<=16500; frame++) {
              uint32_t keys=0;
              if(frame>=3500 && frame<3520) keys=KEY_START;
              if(frame>=3800 && frame<3820) keys=KEY_A;
              if(frame>=4150 && frame<4170) keys=KEY_DOWN;
              if(frame>=4450 && frame<4470) keys=KEY_A;
              // From the first journey setting move down 13 rows to Start adventure.
              if(frame>=4600 && frame<5380 && ((frame-4600)%60)<13) keys=KEY_DOWN;
              if(frame>=5500 && frame<5520) keys=KEY_A;
              // Walk through dialog after the Sinnoh new-game transition.
              if(frame>=5900 && frame<14100 && (frame%180)<14) keys=KEY_A;
              if(frame>=14500 && frame<14580) keys=KEY_DOWN;
              if(frame>=15000 && frame<15080) keys=KEY_RIGHT;
              core->setKeys(core,keys);
              core->runFrame(core);
              if(mi < sizeof(marks)/sizeof(marks[0]) && frame==marks[mi]) {
                snap(frame);
                mi++;
              }
            }
            printf("COMPLETED 16500 GBA frames, running direct core controls\n");
            core->unloadROM(core);
            mCoreConfigDeinit(&core->config);
            core->deinit(core);
            return 0;
          }
          C
          cc -O2 -DENABLE_VFS -DENABLE_DIRECTORIES -o /tmp/gba_test /tmp/gba_test.c -lmgba -lm
      - name: Run core input test and capture GBA framebuffer
        run: |
          timeout 260s /tmp/gba_test rom/pokemon_hoenn_expansion_gen7.gba | tee captures/direct-core.log
      - name: Upload framebuffer captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinnoh-0.9.5-Direct-Core-Captures
          path: captures
          retention-days: 14
          if-no-files-found: warn
