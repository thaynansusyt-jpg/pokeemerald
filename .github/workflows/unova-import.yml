name: Unova - Importar codigo-fonte
on:
  release:
    types: [published]
  push:
    branches: [master]
    paths: ['.github/workflows/unova-import.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag do Release contendo o ZIP do checkpoint"
        required: true
        default: "unova-source-0.10.5"
      source_asset:
        description: "Nome exato do ZIP anexado ao Release"
        required: true
        default: "Pokemon_Hoenn_Expansion_Unova_0.10.5_CHECKPOINT_DEV.zip"
permissions:
  contents: write
jobs:
  import-source:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'unova-source-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout da branch isolada de Unova
        uses: actions/checkout@v4
        with:
          ref: unova-0.10.5-dev
          fetch-depth: 1
          persist-credentials: true
      - name: Baixar e verificar o ZIP do Release
        id: unpack
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && 'Atualização' || inputs.release_tag }}
          ASSET: ${{ inputs.source_asset || 'Pokemon_Hoenn_Expansion_Unova_0.10.5_CHECKPOINT_DEV.zip' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unova-zip /tmp/unova-extracted
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/unova-zip
          test -s "/tmp/unova-zip/$ASSET"
          unzip -tq "/tmp/unova-zip/$ASSET"
          unzip -q "/tmp/unova-zip/$ASSET" -d /tmp/unova-extracted
          mapfile -t roots < <(find /tmp/unova-extracted -maxdepth 3 -type f -name Makefile.termux)
          if [ "${#roots[@]}" -ne 1 ]; then
            echo "ERRO: ZIP precisa conter exatamente uma raiz de projeto com Makefile.termux" >&2
            exit 1
          fi
          src="$(dirname "${roots[0]}")"
          test -f "$src/Makefile"
          test -f "$src/tools/qa_unova_0101.py"
          test -f "$src/tools/qa_unova_integrated.py"
          echo "source=$src" >> "$GITHUB_OUTPUT"
      - name: Importar os arquivos, preservando Git e o CI na branch
        env:
          SOURCE: ${{ steps.unpack.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='/.git/' --exclude='/.github/workflows/' "$SOURCE/" "$GITHUB_WORKSPACE/"
          test -f Makefile
          test -f Makefile.termux
          test -f .github/workflows/unova-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem alteracoes: checkpoint ja importado."
          else
            git commit -m "Import Unova 0.10.5 development checkpoint"
            git push origin HEAD:refs/heads/unova-0.10.5-dev
            echo "Checkpoint importado. A compilacao sera executada neste mesmo workflow."
          fi
      - name: Instalar compilador ARM no GitHub
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi make gcc g++ python3 libpng-dev zlib1g-dev pkg-config
      - name: Verificar codigo e compilar a ROM
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/qa_unova_0101.py &&
            python3 tools/qa_unova_integrated.py &&
            make -f Makefile.termux rom JOBS=2
          } 2>&1 | tee unova-build.log
          test -s pokemon_hoenn_expansion_gen7.gba
          test "$(stat -c %s pokemon_hoenn_expansion_gen7.gba)" -eq 33554432
          sha256sum pokemon_hoenn_expansion_gen7.gba | tee rom.sha256
      - name: Guardar diagnostico da compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unova-build-log
          path: unova-build.log
          if-no-files-found: warn
      - name: Guardar ROM somente quando passar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unova-0105-gba-em-desenvolvimento
          path: |
            pokemon_hoenn_expansion_gen7.gba
            rom.sha256
          if-no-files-found: error
