name: Build Hoenn Expansion

on:
  push:
    branches: [master, hoenn-expansion-alpha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev
      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          ref: da598c1d918402c42c0c0d7128ba14567f3175e9
          path: agbcc
      - name: Build and install compiler
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../
      - name: Build alpha
        run: make -j2 COMPARE=0
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Hoenn-Expansion-0.3.0-alpha
          path: |
            pokemon_hoenn_expansion.gba
            docs/HOENN_EXPANSION.md
          if-no-files-found: error
