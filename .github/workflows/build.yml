name: Build Hoenn Expansion

on:
  push:
    branches: [master, hoenn-expansion-alpha, hoenn-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev
      - name: Build reconstruction
        run: make modern -j2 COMPARE=0
      - name: Archive source checkpoint
        run: git archive --format=zip --output=Hoenn-Expansion-0.4.1-source.zip HEAD
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Hoenn-Expansion-0.4.1-Reconstrucao
          path: |
            pokemon_hoenn_expansion_modern.gba
            Hoenn-Expansion-0.4.1-source.zip
            docs/REBUILD_0.4.1.md
            docs/credits/
            docs/HOENN_EXPANSION.md
          if-no-files-found: error
